<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>XTC Viewer - Ultimate Global</title>
    <style>
        body { background: #1a1a1a; color: #eee; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .controls { background: #333; padding: 10px; border-bottom: 1px solid #444; text-align: center; flex-shrink: 0; z-index: 10; white-space: nowrap; overflow-x: auto; }
        .main-content { display: flex; flex: 1; overflow: hidden; position: relative; }
        #canvas-container { flex: 1; overflow: auto; background: #000; display: flex; align-items: center; justify-content: center; padding: 10px; }
        canvas { background: #fff; box-shadow: 0 0 30px #000; max-width: 100%; max-height: 100%; image-rendering: pixelated; transition: transform 0.2s; }
        #log { width: 280px; background: rgba(0,0,0,0.9); color: #0f0; padding: 10px; font-family: monospace; font-size: 11px; overflow-y: auto; border-left: 1px solid #555; transition: 0.3s; }
        #log.hidden { width: 0; padding: 0; border: none; }
        .seekbar-container { background: #222; padding: 10px 20px; border-top: 1px solid #444; flex-shrink: 0; display: flex; align-items: center; }
        #seekbar { flex: 1; cursor: pointer; margin: 0 15px; }
        .btn { padding: 6px 10px; margin: 0 2px; cursor: pointer; background: #444; color: #fff; border: 1px solid #666; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .btn:hover { background: #666; }
        .btn.active { background: #007bff; border-color: #0056b3; }
        #fileSelect { background: #222; color: #fff; border: 1px solid #666; padding: 4px; margin-right: 5px; max-width: 120px; }
    </style>
</head>
<body>

<div class="controls">
    <input type="file" id="fileInput" accept=".xtc" multiple style="width: 150px;">
    <select id="fileSelect"><option>No File</option></select>
    
    <button class="btn" id="prev">◀</button>
    <input type="number" id="pageInput" min="1" value="1" style="width:45px; background:#222; color:#fff; border:1px solid #666; text-align:center;"> / <span id="totalInfo">0</span>
    <button class="btn" id="next">▶</button>
    
    <span style="border-left: 1px solid #555; margin: 0 5px; padding-left: 5px;"></span>
    
    <button class="btn" id="spreadBtn" data-jp="見開き: OFF" data-en="Spread: OFF">見開き: OFF</button>
    <button class="btn" id="shiftBtn" data-jp="ずらす" data-en="Shift" style="display:none;">ずらす</button>
    <button class="btn" id="rotateBtn" data-jp="回転" data-en="Rotate">回転</button>
    <button class="btn" id="fullBtn" data-jp="全画面" data-en="Full">全画面</button>
    <button class="btn" id="langBtn">EN</button>
    <button class="btn" id="toggleLog" data-jp="ログ" data-en="Log">ログ</button>
</div>

<div class="main-content">
    <div id="canvas-container"><canvas id="c"></canvas></div>
    <div id="log">ログ: ファイルを選択してください...</div>
</div>

<div class="seekbar-container">
    <input type="range" id="seekbar" min="0" max="0" value="0">
</div>

<script>
    const logDiv = document.getElementById('log'), pageInput = document.getElementById('pageInput'), totalInfo = document.getElementById('totalInfo');
    const canvas = document.getElementById('c'), ctx = canvas.getContext('2d'), seekbar = document.getElementById('seekbar');
    const fileSelect = document.getElementById('fileSelect'), langBtn = document.getElementById('langBtn');
    
    let library = [], buf, pages = [], curIdx = 0;
    let isSpread = false, isShifted = false, rotation = 0, currentLang = 'JP';

    function addLog(msg) {
        const line = document.createElement('div');
        line.innerHTML = `> ${msg}`;
        logDiv.appendChild(line);
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    function getUint64LE(v, o) {
        return v.getUint32(o, true) + (v.getUint32(o + 4, true) * 0x100000000);
    }

    // 言語切り替え
    langBtn.onclick = () => {
        currentLang = currentLang === 'JP' ? 'EN' : 'JP';
        langBtn.innerText = currentLang === 'JP' ? 'EN' : 'JP';
        document.querySelectorAll('[data-jp]').forEach(el => {
            el.innerText = el.getAttribute(`data-${currentLang.toLowerCase()}`);
        });
        if(isSpread) document.getElementById('spreadBtn').innerText = (currentLang === 'JP' ? '見開き: ON' : 'Spread: ON');
    };

    document.getElementById('fileInput').onchange = (e) => {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;
        library = files;
        fileSelect.innerHTML = "";
        library.forEach((f, i) => {
            const opt = document.createElement('option');
            opt.value = i; opt.textContent = f.name;
            fileSelect.appendChild(opt);
        });
        loadXTC(0);
    };

    fileSelect.onchange = () => loadXTC(parseInt(fileSelect.value));

    async function loadXTC(idx) {
        if (!library[idx]) return;
        const file = library[idx];
        addLog(`Loading: ${file.name}`);
        buf = await file.arrayBuffer();
        const v = new DataView(buf);
        if (v.getUint8(0) !== 0x58) return addLog("Error: Not XTC");
        const pageCount = v.getUint16(6, true);
        pages = [];
        for (let i = 0; i < pageCount; i++) {
            const o = 48 + (i * 16);
            pages.push({ off: getUint64LE(v, o), len: v.getUint32(o + 8, true) });
        }
        totalInfo.innerText = pages.length;
        seekbar.max = pages.length - 1;
        curIdx = 0; render();
    }

    function decodePage(idx) {
        if (idx < 0 || idx >= pages.length) return null;
        const p = pages[idx], v = new DataView(buf, p.off, p.len);
        const w = v.getUint16(4, true), h = v.getUint16(6, true), dataStart = 22, rowBytes = Math.ceil(w / 8);
        const tmp = document.createElement('canvas'); tmp.width = w; tmp.height = h;
        const tCtx = tmp.getContext('2d'), id = tCtx.createImageData(w, h);
        for (let y = 0; y < h; y++) {
            const rOff = dataStart + (y * rowBytes);
            for (let x = 0; x < w; x++) {
                const bIdx = rOff + (x >> 3);
                if (bIdx >= p.len) continue;
                if (((v.getUint8(bIdx) >> (7 - (x % 8))) & 1)) {
                    const i = (y * w + x) * 4;
                    id.data[i] = id.data[i+1] = id.data[i+2] = 255; id.data[i+3] = 255;
                } else { id.data[(y * w + x) * 4 + 3] = 255; }
            }
        }
        tCtx.putImageData(id, 0, 0); return tmp;
    }

    function render() {
        if (pages.length === 0) return;
        const p1 = decodePage(curIdx);
        if (!p1) return;

        let finalCanvas = document.createElement('canvas');
        let fCtx = finalCanvas.getContext('2d');

        if (isSpread) {
            const nextIdx = isShifted ? curIdx - 1 : curIdx + 1;
            const p2 = decodePage(nextIdx);
            if (p2) {
                finalCanvas.width = p1.width + p2.width;
                finalCanvas.height = Math.max(p1.height, p2.height);
                fCtx.fillStyle = "black"; fCtx.fillRect(0,0,finalCanvas.width,finalCanvas.height);
                if (!isShifted) { fCtx.drawImage(p1, p2.width, 0); fCtx.drawImage(p2, 0, 0); }
                else { fCtx.drawImage(p1, 0, 0); fCtx.drawImage(p2, p1.width, 0); }
            } else { finalCanvas.width = p1.width; finalCanvas.height = p1.height; fCtx.drawImage(p1, 0, 0); }
        } else { finalCanvas.width = p1.width; finalCanvas.height = p1.height; fCtx.drawImage(p1, 0, 0); }

        // 回転処理
        canvas.width = (rotation % 180 === 0) ? finalCanvas.width : finalCanvas.height;
        canvas.height = (rotation % 180 === 0) ? finalCanvas.height : finalCanvas.width;
        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate((rotation * Math.PI) / 180);
        ctx.drawImage(finalCanvas, -finalCanvas.width / 2, -finalCanvas.height / 2);
        ctx.restore();

        pageInput.value = curIdx + 1; seekbar.value = curIdx;
    }

    // 操作
    document.getElementById('prev').onclick = () => { curIdx = Math.max(0, curIdx - (isSpread?2:1)); render(); };
    document.getElementById('next').onclick = () => { curIdx = Math.min(pages.length-1, curIdx + (isSpread?2:1)); render(); };
    seekbar.oninput = () => { curIdx = parseInt(seekbar.value); render(); };
    pageInput.onchange = () => { curIdx = Math.min(pages.length-1, Math.max(0, parseInt(pageInput.value)-1)); render(); };
    
    document.getElementById('rotateBtn').onclick = () => { rotation = (rotation + 90) % 360; render(); };
    document.getElementById('spreadBtn').onclick = (e) => {
        isSpread = !isSpread;
        e.target.innerText = currentLang === 'JP' ? `見開き: ${isSpread ? "ON" : "OFF"}` : `Spread: ${isSpread ? "ON" : "OFF"}`;
        e.target.classList.toggle('active');
        document.getElementById('shiftBtn').style.display = isSpread ? "inline-block" : "none";
        render();
    };
    document.getElementById('shiftBtn').onclick = (e) => { isShifted = !isShifted; e.target.classList.toggle('active'); render(); };
    document.getElementById('fullBtn').onclick = () => {
        const container = document.getElementById('canvas-container');
        if (!document.fullscreenElement) container.requestFullscreen(); else document.exitFullscreen();
    };
    document.getElementById('toggleLog').onclick = () => logDiv.classList.toggle('hidden');

    window.onkeydown = (e) => {
        if (document.activeElement.tagName === "INPUT" || document.activeElement.tagName === "SELECT") return;
        if (e.key === "ArrowRight" || e.key === " ") document.getElementById('next').click();
        if (e.key === "ArrowLeft") document.getElementById('prev').click();
        if (e.key === "r" || e.key === "R") document.getElementById('rotateBtn').click();
        if (e.key === "f" || e.key === "F") document.getElementById('fullBtn').click();
    };
</script>
</body>
</html>
